<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>
<body>
    <header>
        <h1>Practicing Forms</h1>
    </header>
    <main>
        <form action="">
            <!-- El for y el id son para conectar el texto con el campo y aumentar el área de selección -->
            <label type="email" name="email" for="gmail">Email: </label>
            <input type="text" name="email" id="gmail"><br><hr>
    </main>
</body>
</html>
